# AMD ROCm. Same app stack as docker-compose.nvidia.yml, different GPU plumbing.
#
#   docker compose -f docker-compose.amd.yml up -d --build
#
# Images are tagged :rocm so they do not overwrite the NVIDIA builds.
# To use AMD's prebuilt PyTorch image instead of pip nightly wheels, change
# BASE_IMAGE below to e.g. rocm/pytorch:rocm7.2.4_ubuntu24.04_py3.12_pytorch_release_2.9.1
# and set TORCH_INDEX_URL to an empty string.

include:
  - common.yml

x-amd-gpu: &amd-gpu
  env_file:
    - .env
  environment:
    HIP_VISIBLE_DEVICES: "0"
    # gfx1200/1201 (RDNA4): flash / mem-efficient SDPA is experimental and off
    # by default, so F5-TTS falls back to the math kernel (~30× slower).
    TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: "1"
    # Blocking GPU wait instead of spinning one CPU core while idle.
    HIP_SCHEDULE: blocking
    HSA_ENABLE_INTERRUPT: "1"
    MIOPEN_FIND_MODE: FAST
    OMP_NUM_THREADS: "4"
    MKL_NUM_THREADS: "4"
    OPENBLAS_NUM_THREADS: "4"
    # HSA_OVERRIDE_GFX_VERSION: "11.0.0"
  devices:
    - /dev/kfd
    - /dev/dri
  group_add:
    - video
    - render
  ipc: host
  cap_add:
    - SYS_PTRACE
  security_opt:
    - seccomp:unconfined
  shm_size: "8gb"
  restart: unless-stopped

services:
  stt:
    <<: *amd-gpu
    build:
      context: ./stt
      args:
        BASE_IMAGE: rocm/dev-ubuntu-24.04:7.2.4
        TORCH_INDEX_URL: https://download.pytorch.org/whl/nightly/rocm7.2/
        PIP_EXTRA_FLAGS: "--pre"
        TORCH_PACKAGES: "torch torchaudio torchvision"
        GPU_FLAVOR: rocm
    image: kuzya-stt:rocm
    ports:
      - "8001:8001"
    volumes:
      - ./models:/app/models
      - ./stt/main.py:/app/main.py
      - hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10m

  tts:
    <<: *amd-gpu
    build:
      context: ./tts
      args:
        BASE_IMAGE: rocm/dev-ubuntu-24.04:7.2.4
        TORCH_INDEX_URL: https://download.pytorch.org/whl/nightly/rocm7.2/
        PIP_EXTRA_FLAGS: "--pre"
        TORCH_PACKAGES: "torch torchaudio torchvision"
        GPU_FLAVOR: rocm
    image: kuzya-tts:rocm
    ports:
      - "8002:8002"
    volumes:
      - ./models:/app/models
      - ./tts/main.py:/app/main.py
      - hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 8m
