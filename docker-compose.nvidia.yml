# NVIDIA (DGX Spark / CUDA). Default: docker compose up
#
# GPU access is not in the shared file: Compose merges device lists, so NVIDIA
# + AMD reservations would both apply if they shared one stt/tts service.

include:
  - common.yml

x-nvidia-gpu: &nvidia-gpu
  env_file:
    - .env
  environment:
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: compute,utility
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  shm_size: "2gb"
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  restart: unless-stopped

services:
  stt:
    <<: *nvidia-gpu
    build:
      context: ./stt
      args:
        BASE_IMAGE: nvidia/cuda:13.3.1-cudnn-runtime-ubuntu24.04
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu130/
        TORCH_PACKAGES: "torch torchaudio torchvision"
        GPU_FLAVOR: nvidia
    image: kuzya-stt:nvidia
    ports:
      - "8001:8001"
    volumes:
      - ./models:/app/models
      - ./stt/main.py:/app/main.py
      - hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10m

  tts:
    <<: *nvidia-gpu
    build:
      context: ./tts
      args:
        BASE_IMAGE: nvidia/cuda:13.3.1-cudnn-runtime-ubuntu24.04
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu130/
        TORCH_PACKAGES: "torch torchaudio torchvision"
        GPU_FLAVOR: nvidia
    image: kuzya-tts:nvidia
    ports:
      - "8002:8002"
    volumes:
      - ./models:/app/models
      - ./tts/main.py:/app/main.py
      - hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 8m
