# CPU services and volumes. STT/TTS GPU wiring lives in
# docker-compose.nvidia.yml (NVIDIA) or docker-compose.amd.yml (ROCm).

services:
  open-webui:
    build: ./webui
    image: kuzya-open-webui:local
    ports:
      - "${WEBUI_BIND:-127.0.0.1}:${WEBUI_PORT:-3000}:8080"
    env_file:
      - .env
    environment:
      # Harmless on AMD. On DGX OS the default runtime is often nvidia.
      NVIDIA_VISIBLE_DEVICES: void
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URL: ${LLM_URL}
      OPENAI_API_KEY: ${LLM_API_KEY:-sk-local}
      WEBUI_URL: ${WEBUI_URL:-https://localhost}
      FORWARDED_ALLOW_IPS: "*"
      AUDIO_STT_ENGINE: openai
      AUDIO_STT_OPENAI_API_BASE_URL: ${STT_URL}
      AUDIO_STT_OPENAI_API_KEY: ${STT_API_KEY:-sk-local}
      AUDIO_STT_MODEL: ${STT_MODEL:-turbo}
      AUDIO_STT_SUPPORTED_CONTENT_TYPES: audio/*,video/webm
      AUDIO_TTS_ENGINE: openai
      AUDIO_TTS_OPENAI_API_BASE_URL: ${TTS_URL}
      AUDIO_TTS_OPENAI_API_KEY: ${TTS_API_KEY:-sk-local}
      AUDIO_TTS_MODEL: ${TTS_MODEL:-f5-tts}
      AUDIO_TTS_VOICE: ${DEFAULT_VOICE:-default}
      AUDIO_TTS_SPLIT_ON: punctuation
      AIOHTTP_CLIENT_TIMEOUT: "300"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-change-me}
      WEBUI_NAME: ${WEBUI_NAME:-Kuzya}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      stt:
        condition: service_started
      tts:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  lb:
    build: ./lb
    ports:
      - "${HTTP_PORT:-80}:80"
      - "443:443"
    environment:
      NVIDIA_VISIBLE_DEVICES: void
      WEBUI_URL: ${WEBUI_URL:-https://localhost}
      TLS_CERT: ${TLS_CERT:-fullchain.pem}
      TLS_KEY: ${TLS_KEY:-privkey.pem}
      TLS_DAYS: ${TLS_DAYS:-825}
    volumes:
      - ${TLS_CERT_DIR:-./certs}:/etc/nginx/certs
    depends_on:
      open-webui:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-skf", "https://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  open-webui-data:
  hf_cache:
